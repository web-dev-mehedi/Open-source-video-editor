<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CaptionForge — AI Captions & Video Editor</title>
    <!-- Google Fonts Non-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bebas+Neue&family=Caveat:wght@600;700&family=Cinzel:wght@700;800;900&family=Courier+Prime:wght@700&family=Dancing+Script:wght@700&family=Hind+Siliguri:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:wght@400;600;700;800;900&family=Noto+Sans+Bengali:wght@400;600;700;800;900&family=Orbitron:wght@700;800;900&family=Oswald:wght@500;700&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,700;1,700;1,900&family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Poppins:wght@400;600;700;800;900&family=Righteous&family=Roboto:wght@300;400;500;700;900&family=Rubik+Glitch&family=Syne:wght@700;800;900&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;900&display=swap">
    </noscript>
    <style>
      /* Immediate native dark styling to prevent flash */
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background-color: #0A0A0F;
        color: #F3F4F6;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      .cf-initial-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background-color: #0A0A0F;
        gap: 16px;
      }
      .cf-splash-logo {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(135deg, #8B5CF6 0%, #06B6D4 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 32px rgba(6, 182, 212, 0.45);
        animation: cf-pulse 2s infinite ease-in-out;
      }
      .cf-splash-logo svg {
        width: 28px;
        height: 28px;
        fill: none;
        stroke: #000;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .cf-splash-title {
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 2px;
        color: #FFFFFF;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      }
      .cf-splash-title span {
        color: #06B6D4;
      }
      .cf-splash-bar {
        width: 160px;
        height: 3px;
        background: #1F1F24;
        border-radius: 999px;
        overflow: hidden;
        position: relative;
        margin-top: 4px;
      }
      .cf-splash-progress {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, #8B5CF6, #06B6D4);
        border-radius: 999px;
        animation: cf-progress-sweep 1.2s infinite ease-in-out;
      }
      @keyframes cf-pulse {
        0%, 100% { transform: scale(1); filter: brightness(1); }
        50% { transform: scale(1.04); filter: brightness(1.15); }
      }
      @keyframes cf-progress-sweep {
        0% { left: -40%; }
        100% { left: 100%; }
      }
    </style>
  </head>
  <body class="bg-canvas-dark text-gray-100 antialiased overflow-hidden select-none">
    <div id="root">
      <div class="cf-initial-splash">
        <div class="cf-splash-logo">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"></path>
          </svg>
        </div>
        <div class="cf-splash-title">CAPTION<span>FORGE</span></div>
        <div class="cf-splash-bar">
          <div class="cf-splash-progress"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
